# SSAS Multidimensional on a GitHub-hosted Windows runner: SQL Server 2022 Developer with
# Analysis Services is installed on the runner, the star is loaded, the cube is created and
# processed, and the 10 MDX queries are executed and compared with the reference.
# Manual start only (gh workflow run ssas-windows.yml). Without a push or pull_request trigger
# the local CI does not select this file; the Linux jobs stay in ci.yml.
name: SSAS on Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ssas-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssas:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: src
      EVIDENCE: reports/ssas
      SQLSERVER_MODULE_VERSION: '22.4.5.1'
      # SQL Server 2022 Developer ISO from download.microsoft.com. URL and SHA-256 as pinned by the
      # Chocolatey package sql-server-2022 (https://community.chocolatey.org/packages/sql-server-2022).
      SQL_ISO_URL: https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso
      SQL_ISO_SHA256: 80D2CD75DD2B28098C0182F50AD86BD44F9B3A9F357C30FF617480A1497DAFFD
      SETUP_LOG: 'C:\Program Files\Microsoft SQL Server\160\Setup Bootstrap\Log'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 1. Build the seed and check the reference against docs/runs/expected-seed64.json
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          python --version
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install exited with $LASTEXITCODE" }
          python -m sales_cube --output reports
          if ($LASTEXITCODE -ne 0) { throw "python -m sales_cube exited with $LASTEXITCODE" }
          Get-Content -Encoding UTF8 reports/summary.txt
          python -c "import json, sys; a = json.load(open('reports/expected.json', encoding='utf-8')); b = json.load(open('docs/runs/expected-seed64.json', encoding='utf-8')); sys.exit(0 if a == b else 'reports/expected.json differs from docs/runs/expected-seed64.json')"
          if ($LASTEXITCODE -ne 0) { throw 'The generated reference differs from the published one.' }
          $line = "reference: reports/expected.json equals docs/runs/expected-seed64.json (seed 64)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line

      - name: 2a. Download the SQL Server 2022 Developer ISO and check its SHA-256
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'
          curl.exe -fsSL --retry 3 -o $iso $env:SQL_ISO_URL
          if ($LASTEXITCODE -ne 0) { throw "curl exited with $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $iso).Hash
          $line = "SQL Server media: SQLServer2022-x64-ENU-Dev.iso, $((Get-Item -LiteralPath $iso).Length) bytes, SHA-256 $hash"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($hash -ne $env:SQL_ISO_SHA256) { throw "SHA-256 differs from the pinned $env:SQL_ISO_SHA256" }

      - name: 2b. Install SQL Server 2022 Developer - Database Engine and Analysis Services (Multidimensional)
        id: install
        timeout-minutes: 50
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'
          # Pending reboot markers, printed for diagnosis; the setup rule RebootRequiredCheck is skipped
          # below, as the Chocolatey package does with /IgnorePendingReboot.
          foreach ($key in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending',
                           'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') {
            Write-Output "pending reboot marker $key present: $(Test-Path $key)"
          }
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          $letter = $null
          for ($i = 1; $i -le 10 -and -not $letter; $i++) {
            $letter = ($image | Get-Volume).DriveLetter
            if (-not $letter) { Start-Sleep -Seconds 3 }
          }
          if (-not $letter) { throw 'The mounted ISO got no drive letter.' }
          $setup = "${letter}:\setup.exe"
          Write-Output "setup: $setup $((Get-Item $setup).VersionInfo.ProductVersion)"
          $who = "$env:USERDOMAIN\$env:USERNAME"
          # Parameters: https://learn.microsoft.com/sql/database-engine/install-windows/install-sql-server-from-the-command-prompt
          # Developer edition: the product key is predefined, /PID is not needed. ASSERVERMODE must be upper case.
          $arguments = @(
            '/Q', '/ACTION=Install', '/IACCEPTSQLSERVERLICENSETERMS', '/UPDATEENABLED=False',
            '/FEATURES=SQLENGINE,AS', '/INSTANCENAME=MSSQLSERVER',
            '/SQLSVCACCOUNT="NT Service\MSSQLSERVER"', "/SQLSYSADMINACCOUNTS=`"$who`" `"BUILTIN\Administrators`"",
            '/ASSVCACCOUNT="NT Service\MSSQLServerOLAPService"', "/ASSYSADMINACCOUNTS=`"$who`"",
            '/ASSERVERMODE=MULTIDIMENSIONAL', '/TCPENABLED=1', '/SkipRules=RebootRequiredCheck'
          ) -join ' '
          Write-Output "setup arguments: $arguments"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          $code = $process.ExitCode
          $minutes = [math]::Round($watch.Elapsed.TotalMinutes, 1)
          $summaryFile = Join-Path $env:SETUP_LOG 'Summary.txt'
          if (Test-Path -LiteralPath $summaryFile) {
            Write-Output '--- Summary.txt (head) ---'
            Get-Content -LiteralPath $summaryFile -TotalCount 40
          }
          $line = "SQL Server setup: exit code $code in $minutes min (features SQLENGINE,AS; ASSERVERMODE=MULTIDIMENSIONAL)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($code -ne 0 -and $code -ne 3010) {
            if (Test-Path -LiteralPath $summaryFile) {
              Write-Output '--- Summary.txt (tail) ---'
              Get-Content -LiteralPath $summaryFile -Tail 80
            }
            throw "SQL Server setup exited with $code"
          }
          Dismount-DiskImage -ImagePath $iso | Out-Null

      - name: 3a. SqlServer PowerShell module, pinned version
        run: |
          $ErrorActionPreference = 'Stop'
          $wanted = [version]$env:SQLSERVER_MODULE_VERSION
          Get-Module -ListAvailable SqlServer | Format-Table Name, Version, ModuleBase -AutoSize | Out-String -Width 300
          if (-not (Get-Module -ListAvailable SqlServer | Where-Object Version -eq $wanted)) {
            Install-Module SqlServer -RequiredVersion $wanted -Repository PSGallery -Scope AllUsers -Force -AllowClobber
          }
          # The scripts call Import-Module SqlServer, which takes the newest installed version.
          $module = Get-Module -ListAvailable SqlServer | Sort-Object Version -Descending | Select-Object -First 1
          if ($module.Version -ne $wanted) { throw "The newest SqlServer module is $($module.Version), not $wanted" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "AMO_DIR=$($module.ModuleBase)`n")
          $line = "SqlServer module: $($module.Version) at $($module.ModuleBase)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line

      - name: 3b. Wait for both services; versions, edition and server mode
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'MSSQLSERVER', 'MSSQLServerOLAPService') {
            $service = Get-Service -Name $name
            if ($service.Status -ne 'Running') { Start-Service -Name $name }
            $service.WaitForStatus('Running', [TimeSpan]::FromMinutes(3))
            Get-CimInstance Win32_Service -Filter "Name='$name'" | Format-List Name, State, StartMode, StartName, PathName
          }
          $sqlcmd = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sqlcmd) {
            $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\SQLCMD.EXE' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $found) { throw 'sqlcmd.exe is not on PATH and not under Client SDK\ODBC.' }
            $env:PATH = "$($found.DirectoryName);$env:PATH"
            [IO.File]::AppendAllText($env:GITHUB_PATH, "$($found.DirectoryName)`n")
            $sqlcmd = Get-Command sqlcmd.exe
          }
          Write-Output "sqlcmd: $($sqlcmd.Source) $($sqlcmd.Version)"
          for ($i = 1; $i -le 30; $i++) {
            sqlcmd -S localhost -E -C -b -Q 'SELECT 1' | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          $engine = sqlcmd -S localhost -E -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CONCAT(CAST(SERVERPROPERTY('ProductVersion') AS nvarchar(128)), ' | ', CAST(SERVERPROPERTY('Edition') AS nvarchar(128)), ' | ', REPLACE(REPLACE(@@VERSION, CHAR(13), ' '), CHAR(10), ' '))"
          if ($LASTEXITCODE -ne 0) { throw "sqlcmd exited with $LASTEXITCODE" }
          $line = "Database Engine: $(($engine | Where-Object { $_ }) -join ' ')"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          try {
            & .\scripts\Get-AnalysisServer.ps1 -Server localhost -AmoDirectory $env:AMO_DIR |
              Tee-Object -FilePath "$env:EVIDENCE/analysis-server.txt"
          } finally {
            Get-Content "$env:EVIDENCE/analysis-server.txt" -ErrorAction SilentlyContinue |
              Where-Object { $_ -match '^(Analysis Services (version|edition|server mode)|msmdsrv.ini)' } |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_ }
          }

      - name: 4. Load the star with sqlcmd and check rows and totals
        run: |
          $ErrorActionPreference = 'Stop'
          sqlcmd -S localhost -E -C -b -Q 'CREATE DATABASE P64SalesDW'
          if ($LASTEXITCODE -ne 0) { throw "CREATE DATABASE exited with $LASTEXITCODE" }
          # The same load as in docs/MANUAL_STEPS.md, step 1.
          sqlcmd -S localhost -E -C -d P64SalesDW -b -i sql/load.sql
          if ($LASTEXITCODE -ne 0) { throw "sql/load.sql exited with $LASTEXITCODE" }
          $query = 'SET NOCOUNT ON; SELECT (SELECT COUNT(*) FROM dbo.DimDate), (SELECT COUNT(*) FROM dbo.DimProduct), (SELECT COUNT(*) FROM dbo.DimCustomer), COUNT(*), SUM(Units), SUM(Revenue) FROM dbo.FactSales'
          $row = sqlcmd -S localhost -E -C -d P64SalesDW -b -h -1 -W -s '|' -Q $query
          if ($LASTEXITCODE -ne 0) { throw "the count query exited with $LASTEXITCODE" }
          $values = (($row | Where-Object { $_ -match '\|' }) -split '\|') | ForEach-Object { [long]$_ }
          # Rows: docs/runs/2026-11-18-mssql.md (seed 64); totals: 01_total and 02_units_by_year of the reference.
          $totals = python -c "import json; r = json.load(open('docs/runs/expected-seed64.json', encoding='utf-8')); print(sum(x[1] for x in r['02_units_by_year']), r['01_total'][0][0])"
          if ($LASTEXITCODE -ne 0) { throw 'Reading the reference totals failed.' }
          $units, $revenue = $totals -split ' ' | ForEach-Object { [long]$_ }
          $expected = [long[]](731, 6, 4, 1838, $units, $revenue)
          $labels = 'DimDate', 'DimProduct', 'DimCustomer', 'FactSales', 'SUM(Units)', 'SUM(Revenue)'
          $bad = @()
          for ($i = 0; $i -lt 6; $i++) {
            Write-Output ('{0}: {1} (expected {2})' -f $labels[$i], $values[$i], $expected[$i])
            if ($values[$i] -ne $expected[$i]) { $bad += $labels[$i] }
          }
          $line = 'star in SQL Server: ' + (($labels | ForEach-Object -Begin { $k = 0 } -Process { "$_ $($values[$k++])" }) -join ', ')
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($values.Count -ne 6 -or $bad.Count -gt 0) { throw "The star differs from the seed 64 record: $($bad -join ', ')" }

      - name: 5. Read access of the Analysis Services service account to the star
        run: |
          $ErrorActionPreference = 'Stop'
          $account = (Get-CimInstance Win32_Service -Filter "Name='MSSQLServerOLAPService'").StartName
          if ($account -eq 'LocalSystem') { $account = 'NT AUTHORITY\SYSTEM' }
          Write-Output "Analysis Services service account: $account"
          # sqlcmd reads scripting variables from the environment: no quoting of the account name.
          $env:SsasAccount = $account
          sqlcmd -S localhost -E -C -d P64SalesDW -b -i sql/grant_ssas.sql
          if ($LASTEXITCODE -ne 0) { throw "sql/grant_ssas.sql exited with $LASTEXITCODE" }
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "SSAS service account with db_datareader on P64SalesDW: $account"

      - name: 6. Validate the cube model with AMO (scripts/Confirm-Model.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\scripts\Confirm-Model.ps1 -AmoDirectory $env:AMO_DIR | Tee-Object -FilePath "$env:EVIDENCE/amo-validate.txt"
          } catch {
            Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/amo-validate.txt" -Value "FAILED: $($_.Exception.Message)"
            throw
          }
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value ('AMO Validate: ' + ((Get-Content "$env:EVIDENCE/amo-validate.txt") -join '; '))

      - name: 7. Create (cube/create.xmla) and ProcessFull (cube/process.xmla) with Invoke-ASCmd
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Invoke-Xmla.ps1 -Server localhost -InputFile cube/create.xmla -OutFile "$env:EVIDENCE/create-response.xml"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value 'Create (cube/create.xmla): no Exception or Error in the answer'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & .\scripts\Invoke-Xmla.ps1 -Server localhost -InputFile cube/process.xmla -OutFile "$env:EVIDENCE/process-response.xml"
          $line = "ProcessFull (cube/process.xmla): no Exception or Error in the answer, $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line

      - name: 8. Processed state, MOLAP storage and key level members
        run: |
          $ErrorActionPreference = 'Stop'
          $query = 'SET NOCOUNT ON; SELECT (SELECT COUNT(*) FROM dbo.DimDate), (SELECT COUNT(*) FROM dbo.DimProduct), (SELECT COUNT(*) FROM dbo.DimCustomer)'
          $row = sqlcmd -S localhost -E -C -d P64SalesDW -b -h -1 -W -s '|' -Q $query
          if ($LASTEXITCODE -ne 0) { throw "the count query exited with $LASTEXITCODE" }
          $rows = (($row | Where-Object { $_ -match '\|' }) -split '\|') | ForEach-Object { [int]$_ }
          $members = @{ Date = $rows[0]; Product = $rows[1]; Customer = $rows[2] }
          try {
            & .\scripts\Test-CubeState.ps1 -Server localhost -AmoDirectory $env:AMO_DIR -ExpectedMembers $members -OutDir "$env:EVIDENCE/cube-state" |
              Tee-Object -FilePath "$env:EVIDENCE/cube-state.txt"
          } catch {
            Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/cube-state.txt" -Value "FAILED: $($_.Exception.Message)"
            throw
          }
          Get-Content "$env:EVIDENCE/cube-state.txt" |
            Where-Object { $_ -cmatch '^(Database|Cube|Partition|members of|DISCOVER_PARTITION_STAT)' } |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_ }

      - name: 9. Execute the 10 MDX queries in SSAS and compare (scripts/Compare-Cube.ps1)
        id: compare
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\scripts\Compare-Cube.ps1 -Server localhost | Tee-Object -FilePath "$env:EVIDENCE/compare.txt"
          } finally {
            $answers = Get-ChildItem -Directory reports/actual -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -Last 1
            if ($answers) { [IO.File]::AppendAllText($env:GITHUB_ENV, "P64_ANSWERS=$($answers.FullName)`n") }
            Get-Content "$env:EVIDENCE/compare.txt" -ErrorAction SilentlyContinue |
              Where-Object { $_ -match 'answers match the reference|MDX cellsets match' } |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_ }
          }

      - name: 10. Negative controls on the SSAS answers
        if: always() && steps.compare.outcome != 'skipped'
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:P64_ANSWERS) { throw 'No folder of SSAS answers.' }
          Write-Output "answers: $env:P64_ANSWERS"
          python -m pytest -v -m slow tests/test_mondrian_answers.py | Tee-Object -FilePath "$env:EVIDENCE/negative.txt"
          $code = $LASTEXITCODE
          $last = Get-Content "$env:EVIDENCE/negative.txt" | Where-Object { $_ -match '(passed|failed|error)' } | Select-Object -Last 1
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "negative controls on the SSAS answers (tests/test_mondrian_answers.py): $last"
          if ($code -ne 0) { throw "pytest exited with $code" }

      - name: Logs of setup, SQL Server and Analysis Services (on failure)
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path "$env:EVIDENCE/logs" | Out-Null
          if (Test-Path -LiteralPath $env:SETUP_LOG) {
            Copy-Item -Recurse -Force -LiteralPath $env:SETUP_LOG -Destination "$env:EVIDENCE/logs/setup-bootstrap"
            $summaryFile = Join-Path $env:SETUP_LOG 'Summary.txt'
            if (Test-Path -LiteralPath $summaryFile) { Write-Output '--- Summary.txt (tail) ---'; Get-Content -LiteralPath $summaryFile -Tail 80 }
          }
          $root = 'C:\Program Files\Microsoft SQL Server'
          Get-ChildItem "$root\MSSQL16.*\MSSQL\Log\ERRORLOG" -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:EVIDENCE/logs/"
          Get-ChildItem "$root\MSAS16.*\OLAP\Log\*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:EVIDENCE/logs/"
          Get-ChildItem "$root\MSAS16.*\OLAP\Log\msmdsrv.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "--- $($_.FullName) (tail) ---"; Get-Content $_.FullName -Tail 60 }
          exit 0

      - name: 11. Summary
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $file = "$env:EVIDENCE/summary.txt"
          $lines = @(Get-Content -Encoding UTF8 $file -ErrorAction SilentlyContinue)
          foreach ($key in 'reference:', 'SQL Server media:', 'SQL Server setup:', 'SqlServer module:', 'Database Engine:',
                           'Analysis Services server mode', 'star in SQL Server:', 'SSAS service account', 'AMO Validate:',
                           'Create (', 'ProcessFull (', 'Cube state:', 'SSAS answers match the reference', 'negative controls') {
            if (-not ($lines | Where-Object { $_.Contains($key) })) { $lines += "$key not reached" }
          }
          $lines | Set-Content -Encoding UTF8 $file
          $lines
          $markdown = @('### SSAS on Windows') + ($lines | ForEach-Object { "- $_" })
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($markdown -join "`n") + "`n")

      - name: 12. Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssas-windows-evidence
          path: |
            reports/ssas/
            reports/actual/
            reports/expected.json
            reports/summary.txt
          retention-days: 30
          if-no-files-found: warn
