name: ssas-mdx-sales-cube
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04@sha256:ea73825f3d88a23c355ac2f9fdc6bd960fec90171c12c572109b36a558f77bb8
    working_dir: /lab
    # Mondrian (Java on the CI host) reads the star over JDBC; bound to loopback only.
    ports:
      - "127.0.0.1:14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
    volumes:
      - ./sql:/lab/sql:ro
      - ./reports:/lab/reports:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "tcp:localhost,1433", "-C", "-U", "sa", "-b", "-Q", "SELECT 1"]
      interval: 8s
      timeout: 5s
      retries: 24
      start_period: 15s
